name: Build and Test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

env:
  SECRETS: ${{ toJSON(secrets) }}

jobs:
  run-tests:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/checkout@v2
        with:
          repository: journeyapps-platform/ci-actions
          token: ${{ secrets.SHARED_GH_TOKEN }}
          path: .github/ci
          ref: v1

      - name: Setup NodeJS
        uses: actions/setup-node@v2
        with:
          node-version: 16

      - name: Install PNPM
        run: npm i pnpm@7 -g

      - name: Install Dependencies
        uses: ./.github/ci/actions/npm-install
        with:
          client: pnpm

      - name: Build packages
        run: pnpm build

      - name: Test packages
        run: pnpm test