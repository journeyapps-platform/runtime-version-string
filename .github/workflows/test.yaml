name: Build and Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  run-tests:
    name: Test (Node ${{ matrix.node }})
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}

      - name: Prettier check
        run: pnpm exec prettier --check --ignore-path .prettierignore --config .prettierrc '**/*.{ts,tsx,js,jsx}'

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
