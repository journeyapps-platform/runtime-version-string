name: Setup Node and pnpm
description: Set up Node, pnpm, cached dependencies, and install.

inputs:
  node-version:
    description: Optional Node version override for the test matrix.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        registry-url: https://registry.npmjs.org

    - uses: pnpm/action-setup@v6
      with:
        run_install: false
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
